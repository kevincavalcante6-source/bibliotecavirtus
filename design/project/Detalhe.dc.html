<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Biblioteca Virtus — Wallpaper</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body { margin: 0; background: #050505; font-family: Inter, system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: #F5F5F0; text-decoration: none; }
a:hover { color: #C8A96A; }
button.prim:hover { color: #050505; }
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 1120px; box-sizing: border-box; background: #050505; color: #F5F5F0; overflow: hidden;">

  <div style="position: absolute; inset: -80px; background: radial-gradient(120% 80% at 50% 0%, #1D1D1A 0%, #0C0C0B 55%, #060606 100%); filter: blur(72px); transform: scale(1.15);"></div>
  <div style="position: absolute; inset: 0; background: rgba(5,5,5,0.74);"></div>

  <header style="position: relative; height: 80px; box-sizing: border-box; padding: 0 64px; display: flex; align-items: center; justify-content: space-between;">
    <a href="Biblioteca.dc.html" style="display: inline-flex; align-items: center; gap: 10px; font-size: 14px; color: #A8A8A2;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      Biblioteca
    </a>
    <span style="font-size: 12px; letter-spacing: 0.2em; color: #6F6F69;">BIBLIOTECA VIRTUS</span>
    <button type="button" aria-label="Fechar" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; color: #F5F5F0; cursor: pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
  </header>

  <div style="position: relative; box-sizing: border-box; padding: 24px 64px 64px; display: flex; align-items: center; justify-content: center; gap: 96px;">

    <div style="position: relative; width: 404px; height: 875px; flex-shrink: 0; border-radius: 20px; overflow: hidden; border: 1px solid rgba(255,255,255,0.08); background: radial-gradient(120% 80% at 50% 0%, #1D1D1A 0%, #0C0C0B 55%, #060606 100%); box-shadow: 0 48px 96px rgba(0,0,0,0.6);">
      <div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 11px; letter-spacing: 0.24em; color: #454541;">IMAGEM ORIGINAL — PROPORÇÃO PRESERVADA</div>
    </div>

    <div style="width: 400px; flex-shrink: 0;">
      <div style="font-size: 11px; font-weight: 500; letter-spacing: 0.24em; color: {{accent}};">FUNDAMENTOS</div>
      <h1 style="margin: 24px 0 0; font-size: 44px; line-height: 1.15; font-weight: 600; letter-spacing: -0.025em;">Disciplina</h1>
      <p style="margin: 20px 0 0; font-size: 16px; line-height: 1.65; color: #A8A8A2;">Um lembrete discreto para a tela que você abre dezenas de vezes por dia.</p>

      <div style="margin-top: 40px; display: flex; gap: 12px;">
        <button type="button" class="prim" style="flex-grow: 1; height: 52px; display: flex; align-items: center; justify-content: center; gap: 10px; background: #F5F5F0; color: #050505; border: 0; border-radius: 12px; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          Baixar wallpaper
        </button>
        <button type="button" aria-label="Adicionar aos favoritos" style="width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; background: transparent; border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; color: #F5F5F0; cursor: pointer;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg>
        </button>
      </div>

      <div style="margin-top: 48px; border-top: 1px solid rgba(255,255,255,0.08);">
        <div style="padding: 20px 0; display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.08);">
          <span style="font-size: 14px; color: #6F6F69;">Dispositivo</span>
          <span style="font-size: 14px;">iPhone</span>
        </div>
        <div style="padding: 20px 0; display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.08);">
          <span style="font-size: 14px; color: #6F6F69;">Proporção</span>
          <span style="font-size: 14px;">9:19.5</span>
        </div>
        <div style="padding: 20px 0; display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.08);">
          <span style="font-size: 14px; color: #6F6F69;">Resolução</span>
          <span style="font-size: 14px;">1290 × 2796</span>
        </div>
        <div style="padding: 20px 0; display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.08);">
          <span style="font-size: 14px; color: #6F6F69;">Formato</span>
          <span style="font-size: 14px;">PNG</span>
        </div>
      </div>

      <div style="margin-top: 32px; display: flex; align-items: center; gap: 12px;">
        <span style="font-size: 12px; letter-spacing: 0.18em; color: #6F6F69;">TAMBÉM EM</span>
        <button type="button" style="height: 36px; padding: 0 14px; background: transparent; color: #A8A8A2; border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; font-family: inherit; font-size: 12px; cursor: pointer;">Android 9:20</button>
        <button type="button" style="height: 36px; padding: 0 14px; background: transparent; color: #A8A8A2; border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; font-family: inherit; font-size: 12px; cursor: pointer;">Tela de bloqueio</button>
      </div>
    </div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8A96A","options":["#C8A96A","#B89A60","#806B42","#A8A8A2"],"section":"Marca"},"$preview":{"width":1440,"height":1120}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#C8A96A' };
  }
}
</script>
</body>
</html>
